<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <!-- Ferry seen from above, bow pointing right. -->
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7fb8"/>
      <stop offset="1" stop-color="#1f3d63"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8d0da"/>
    </linearGradient>
  </defs>
  <!-- hull -->
  <path d="M8 22 L112 18 C134 18 150 30 156 40 C150 50 134 62 112 62 L8 58 C4 50 4 30 8 22 Z"
        fill="url(#hull)" stroke="#152a45" stroke-width="1.2"/>
  <!-- deck -->
  <path d="M14 27 L110 24 C128 24 140 33 144 40 C140 47 128 56 110 56 L14 53 C11 46 11 34 14 27 Z" fill="url(#deck)"/>
  <!-- superstructure and bridge -->
  <rect x="34" y="31" width="58" height="18" rx="4" fill="#eef1f5" stroke="#8e99a6" stroke-width="1"/>
  <rect x="84" y="32" width="10" height="16" rx="2" fill="#1d2a3a"/>
  <!-- funnel -->
  <rect x="46" y="35" width="12" height="10" rx="3" fill="#f0c38e" stroke="#9a6a3a" stroke-width="1"/>
  <!-- lifeboats -->
  <rect x="40" y="26" width="10" height="4" rx="2" fill="#e8634c"/>
  <rect x="62" y="26" width="10" height="4" rx="2" fill="#e8634c"/>
  <rect x="40" y="50" width="10" height="4" rx="2" fill="#e8634c"/>
  <rect x="62" y="50" width="10" height="4" rx="2" fill="#e8634c"/>
</svg>
