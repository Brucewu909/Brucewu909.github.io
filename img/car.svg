<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Car seen from above, front pointing right. Shaded to read as a small 3D model. -->
  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a86"/>
      <stop offset="0.35" stop-color="#e8634c"/>
      <stop offset="1" stop-color="#9c3424"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f58a74"/>
      <stop offset="1" stop-color="#c24a35"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb4e0"/>
      <stop offset="1" stop-color="#1d2a3a"/>
    </linearGradient>
  </defs>
  <!-- tyres peeking out -->
  <rect x="26" y="33" width="18" height="8" rx="3" fill="#1b1e24"/>
  <rect x="26" y="87" width="18" height="8" rx="3" fill="#1b1e24"/>
  <rect x="84" y="33" width="18" height="8" rx="3" fill="#1b1e24"/>
  <rect x="84" y="87" width="18" height="8" rx="3" fill="#1b1e24"/>
  <!-- body -->
  <rect x="14" y="37" width="102" height="54" rx="18" fill="url(#paint)" stroke="#6e2216" stroke-width="1.2"/>
  <!-- windscreen, roof, rear window -->
  <path d="M78 45 L90 49 L90 79 L78 83 Z" fill="url(#glass)"/>
  <rect x="44" y="45" width="34" height="38" rx="6" fill="url(#roof)"/>
  <path d="M44 47 L34 50 L34 78 L44 81 Z" fill="url(#glass)"/>
  <!-- side mirrors -->
  <rect x="76" y="34" width="5" height="5" rx="1.5" fill="#9c3424"/>
  <rect x="76" y="89" width="5" height="5" rx="1.5" fill="#9c3424"/>
  <!-- highlight, lights -->
  <path d="M26 44 L104 44" stroke="#ffd0c4" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <rect x="110" y="43" width="5" height="9" rx="2" fill="#fff4cf"/>
  <rect x="110" y="76" width="5" height="9" rx="2" fill="#fff4cf"/>
  <rect x="14.5" y="44" width="4" height="8" rx="1.5" fill="#ff3b30"/>
  <rect x="14.5" y="76" width="4" height="8" rx="1.5" fill="#ff3b30"/>
</svg>
